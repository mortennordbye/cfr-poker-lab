name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engines:
    name: Engine tests (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Heads-up preflop
        run: node engines/hu-preflop/test.js
      - name: 6-max preflop
        run: node engines/sixmax-preflop/test.js
      - name: Postflop (JS)
        run: node engines/postflop-js/test.js

  rust:
    name: Rust postflop engine
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Install Rust (stable)
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engines/postflop/rs
      - name: Build
        run: cargo build --release --locked --manifest-path engines/postflop/rs/Cargo.toml
      - name: Postflop (Rust) tests
        run: node engines/postflop/test.js
