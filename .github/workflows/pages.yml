name: Pages

# Builds the static site (browser mode: the engines run in the page, the Rust postflop engine as WebAssembly)
# and deploys it to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      # Caches the cargo registry, the build output and ~/.cargo/bin (wasm-bindgen-cli).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engines/postflop/rs
          key: wasm
      # Installs what is missing (pinned nightly + rust-src, wasm32 target, wasm-bindgen-cli), then builds mt and st.
      - name: Build WebAssembly
        run: tools/build-wasm.sh
      - name: Build
        run: node tools/build-web.js dist
        env:
          WASM_REQUIRED: "1"
      # Precomputed flop reports (release "data", .github/workflows/precompute.yml) for GET /api/reports in the page.
      # No release yet: nothing to copy. A failed download leaves the site without reports, not without a deploy.
      - name: Precomputed data
        run: |
          node tools/fetch-data.js --dest dist/data --only reports --manifest dist/data/manifest.json \
            || echo "::warning::precomputed data not downloaded; the site has no flop reports"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
