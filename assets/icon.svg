<!-- cfr-poker-lab A: on a felt-green tile, a fanned spade card and a card whose face is a solved strategy grid. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="cfr-poker-lab: a spade card and a strategy-grid card on poker felt">
  <title>cfr-poker-lab</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#138A55"/>
      <stop offset="1" stop-color="#04351F"/>
    </linearGradient>
    <radialGradient id="felt" cx="256" cy="236" r="250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3DDC97" stop-opacity=".22"/>
      <stop offset="1" stop-color="#3DDC97" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".12"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".3"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#ECE6D6"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2C33"/>
      <stop offset="1" stop-color="#0B0C10"/>
    </linearGradient>
    <filter id="drop" x="-25%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#011A0F" flood-opacity=".55"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#tile)"/>
  <rect width="512" height="512" rx="112" fill="url(#felt)"/>
  <rect width="512" height="512" rx="112" fill="url(#sheen)"/>

  <!-- back card: ace of spades -->
  <g transform="rotate(-16 172 262)" filter="url(#drop)">
    <rect x="72" y="122" width="200" height="280" rx="22" fill="url(#card)"/>
    <rect x="82" y="132" width="180" height="260" rx="14" fill="none" stroke="#0B0C10" stroke-opacity=".12" stroke-width="2"/>
    <path transform="translate(158 250) scale(54)" fill="url(#ink)"
      d="M0 -1 C0.3 -0.55 1 -0.25 1 0.25 C1 0.6 0.6 0.75 0.25 0.55 C0.3 0.8 0.4 0.95 0.55 1 L-0.55 1 C-0.4 0.95 -0.3 0.8 -0.25 0.55 C-0.6 0.75 -1 0.6 -1 0.25 C-1 -0.25 -0.3 -0.55 0 -1 Z"/>
    <path transform="translate(102 158) scale(13)" fill="url(#ink)"
      d="M0 -1 C0.3 -0.55 1 -0.25 1 0.25 C1 0.6 0.6 0.75 0.25 0.55 C0.3 0.8 0.4 0.95 0.55 1 L-0.55 1 C-0.4 0.95 -0.3 0.8 -0.25 0.55 C-0.6 0.75 -1 0.6 -1 0.25 C-1 -0.25 -0.3 -0.55 0 -1 Z"/>
  </g>

  <!-- front card: a solved strategy grid (raise red, call green, fold blue) -->
  <g transform="rotate(12 340 270)" filter="url(#drop)">
    <rect x="240" y="130" width="200" height="280" rx="22" fill="url(#card)"/>
    <g transform="translate(263 193)">
      <rect x="0"   y="0"   width="34" height="34" rx="5" fill="#E2483D"/>
      <rect x="40"  y="0"   width="34" height="34" rx="5" fill="#E2483D"/>
      <rect x="80"  y="0"   width="34" height="34" rx="5" fill="#E2483D"/>
      <rect x="120" y="0"   width="34" height="34" rx="5" fill="#4CAF50"/>
      <rect x="0"   y="40"  width="34" height="34" rx="5" fill="#E2483D"/>
      <rect x="40"  y="40"  width="34" height="34" rx="5" fill="#E2483D"/>
      <rect x="80"  y="40"  width="34" height="34" rx="5" fill="#4CAF50"/>
      <rect x="120" y="40"  width="34" height="34" rx="5" fill="#4CAF50"/>
      <rect x="0"   y="80"  width="34" height="34" rx="5" fill="#E2483D"/>
      <rect x="40"  y="80"  width="34" height="34" rx="5" fill="#4CAF50"/>
      <rect x="80"  y="80"  width="34" height="34" rx="5" fill="#4CAF50"/>
      <rect x="120" y="80"  width="34" height="34" rx="5" fill="#3F6DB3"/>
      <rect x="0"   y="120" width="34" height="34" rx="5" fill="#4CAF50"/>
      <rect x="40"  y="120" width="34" height="34" rx="5" fill="#4CAF50"/>
      <rect x="80"  y="120" width="34" height="34" rx="5" fill="#3F6DB3"/>
      <rect x="120" y="120" width="34" height="34" rx="5" fill="#3F6DB3"/>
    </g>
  </g>

  <rect x="1.5" y="1.5" width="509" height="509" rx="110.5" fill="none" stroke="url(#edge)" stroke-width="3"/>
</svg>
