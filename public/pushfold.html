<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Push/Fold Solver</title>
<style>
  :root { --bg:#17181c; --panel:#202127; --line:#2c2e35; --text:#e8e8ea; --muted:#8d8f98;
          --red:#e2483d; --blue:#3f6db3; --dark:#7a2620; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.4 -apple-system,system-ui,sans-serif; }
  header { display:flex; gap:18px; align-items:center; padding:12px 16px; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0 12px 0 0; font-weight:600; }
  label { color:var(--muted); display:flex; gap:6px; align-items:center; }
  input { width:72px; background:#121317; color:var(--text); border:1px solid var(--line); border-radius:4px; padding:5px 7px; font-size:14px; }
  button { background:var(--red); color:#fff; border:0; border-radius:4px; padding:7px 16px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  .seg { display:flex; border:1px solid var(--line); border-radius:4px; overflow:hidden; }
  .seg button { background:transparent; color:var(--muted); border-radius:0; font-weight:500; }
  .seg button.on { background:#33353d; color:var(--text); }
  main { display:flex; gap:14px; padding:14px; align-items:flex-start; }
  aside { width:340px; flex:none; }
  #grid { display:grid; grid-template-columns:repeat(13,1fr); gap:2px; aspect-ratio:1; width:min(calc(100vw - 382px), calc(100vh - 90px)); }
  .cell { position:relative; background:var(--blue); overflow:hidden; border-radius:1px; cursor:default; container-type:inline-size; }
  .cell .fill { position:absolute; inset:0 auto 0 0; background:var(--red); }
  .cell .name { position:absolute; left:5%; top:3%; font-size:clamp(9px,22cqw,17px); }
  .cell .ev { position:absolute; right:5%; bottom:3%; font-size:clamp(8px,15cqw,13px); color:#f2f2f2; }
  .cell:hover { outline:2px solid #fff; z-index:1; }
  aside { display:flex; flex-direction:column; gap:12px; }
  .box { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:12px; }
  .box h2 { margin:0 0 10px; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:600; }
  .acts { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .act { padding:10px; border-radius:4px; min-height:84px; display:flex; flex-direction:column; justify-content:space-between; }
  .act .t { font-size:16px; } .act .p { font-size:24px; } .act .c { font-size:11px; opacity:.85; }
  .bar { display:flex; height:10px; border-radius:3px; overflow:hidden; margin-top:8px; background:var(--blue); }
  .bar div { background:var(--red); }
  dl { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; margin:0; }
  dt { color:var(--muted); } dd { margin:0; text-align:right; font-variant-numeric:tabular-nums; }
  #hover dd { text-align:right; }
  .note { color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>Push/Fold Solver · HU · ChipEV</h1>
  <label>Stack <input id="stack" type="number" value="10" min="1.5" max="200" step="0.5"> bb</label>
  <label>Ante <input id="ante" type="number" value="0" min="0" max="2" step="0.05"> bb</label>
  <label>Iterations <input id="iters" type="number" value="3000" min="10" max="50000" step="100"></label>
  <button id="solve">Solve</button>
  <div class="seg"><button id="vSB" class="on">SB push</button><button id="vBB">BB call</button></div>
</header>
<main>
  <div id="grid"></div>
  <aside>
    <div class="box"><h2 id="spotTitle">SB · first to act</h2>
      <div class="acts" id="acts"></div>
      <div class="bar"><div id="barFill"></div></div>
    </div>
    <div class="box"><h2>Solve</h2>
      <dl>
        <dt>Iterations</dt><dd id="sIt">-</dd>
        <dt>Exploitability</dt><dd id="sEx">-</dd>
        <dt>SB EV per hand</dt><dd id="sEv">-</dd>
        <dt>Solve time</dt><dd id="sMs">-</dd>
      </dl>
    </div>
    <div class="box" id="hover"><h2>Hand</h2><div class="note">Hover a cell.</div></div>
    <div class="note">Red = all-in (SB) or call (BB). Blue = fold. The number in a cell is the hand's EV in bb, where fold = 0. Equities: Monte Carlo, card removal included.</div>
  </aside>
</main>
<script>
const $ = (id) => document.getElementById(id);
let data = null, view = 'sb';
const fmt = (x, d = 2) => (x === null || x === undefined) ? '–' : (Math.abs(x) < 0.5 * 10 ** -d ? 0 : +x).toFixed(d);

// Build the 13x13 grid once.
const cells = [];
for (let k = 0; k < 169; k++) {
  const el = document.createElement('div');
  el.className = 'cell';
  el.innerHTML = '<div class="fill"></div><span class="name"></span><span class="ev"></span>';
  el.addEventListener('mouseenter', () => showHand(k));
  $('grid').appendChild(el); cells.push(el);
}

function render() {
  if (!data) return;
  const side = data[view], act = view === 'sb' ? 'push' : 'call';
  const label = view === 'sb' ? 'Allin ' + data.stack : 'Call';
  side.strategy.forEach((h, k) => {
    const el = cells[k];
    el.querySelector('.name').textContent = h.hand;
    el.querySelector('.fill').style.width = (100 * h.freq).toFixed(1) + '%';
    el.querySelector('.ev').textContent = fmt(h.evHand);
  });
  const a = side.actions[act], f = side.actions.fold;
  $('spotTitle').textContent = view === 'sb' ? 'SB · first to act' : 'BB · facing SB all-in';
  $('acts').innerHTML =
    `<div class="act" style="background:var(--red)"><span class="t">${label}</span><span class="p">${(100*a/1326).toFixed(1)}%</span><span class="c">${a.toFixed(1)} combos</span></div>` +
    `<div class="act" style="background:var(--blue)"><span class="t">Fold</span><span class="p">${(100*f/1326).toFixed(1)}%</span><span class="c">${f.toFixed(1)} combos</span></div>`;
  $('barFill').style.width = (100 * a / 1326) + '%';
  $('sIt').textContent = data.iterations;
  $('sEx').textContent = fmt(data.exploitabilityPctPot, 4) + '% pot';
  $('sEv').textContent = fmt(data.sbValue, 3) + ' bb';
  $('sMs').textContent = (data.ms / 1000).toFixed(2) + ' s';
}

function showHand(k) {
  if (!data) return;
  const h = data[view].strategy[k];
  const act = view === 'sb' ? 'push' : 'call', name = view === 'sb' ? 'All-in' : 'Call';
  $('hover').innerHTML = `<h2>${h.hand} · ${h.combos} combos</h2><dl>
    <dt>${name} frequency</dt><dd>${(100*h.freq).toFixed(1)}%</dd>
    <dt>EV ${name.toLowerCase()}</dt><dd>${fmt(h.ev[act])} bb</dd>
    <dt>EV fold</dt><dd>0.00 bb</dd>
    <dt>EV of hand</dt><dd>${fmt(h.evHand)} bb</dd></dl>`;
}

async function solve() {
  $('solve').disabled = true; $('solve').textContent = 'Solving…';
  const q = new URLSearchParams({ stack: $('stack').value, ante: $('ante').value, iterations: $('iters').value });
  try { data = await (await (window.cfrLocalApi ? window.cfrLocalApi.fetch : fetch)('/api/pushfold?' + q)).json(); render(); }
  finally { $('solve').disabled = false; $('solve').textContent = 'Solve'; }
}

function setView(v) { view = v; $('vSB').classList.toggle('on', v === 'sb'); $('vBB').classList.toggle('on', v === 'bb'); render(); }
$('vSB').onclick = () => setView('sb');
$('vBB').onclick = () => setView('bb');
$('solve').onclick = solve;
document.querySelectorAll('input').forEach((i) => i.addEventListener('keydown', (e) => e.key === 'Enter' && solve()));
solve();
</script>
</body>
</html>
